<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orb Pop 30 · Arcade Kit demo</title>
<link rel="stylesheet" href="../../shared/theme.css">
<style>html,body{height:100%;overflow:hidden}canvas{display:block}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:18px;text-align:center;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,17,23,.6)}
#ov .card{text-align:center;max-width:380px}</style></head><body>
<div id="hud"><b id="sc">0</b> pts · <span id="tm">30.0</span>s</div>
<div id="ov"><div class="card"><span class="pill">Arcade Kit demo</span><h1 style="font-size:30px">ORB POP 30</h1>
<p class="muted">Pop as many orbs as you can in 30 seconds. Gold orbs are worth 5x. Missing costs you points.</p><div id="msg"></div>
<button class="btn primary big" id="go">▶ Play</button> <a class="btn" href="../">← kit docs</a></div></div>
<script src="../../shared/vendor/three.min.js"></script>
<script src="../kit.js" data-game="Orb Pop 30" data-venmo="alexnaughtonjr" data-contact="https://x.com/alexnaughtonjr" data-ad-price="50" data-position="bottom-left"
  data-ring="../../weekly-game-drop/neon-drift/,../../live-arcade/"></script>
<script>
const R = new THREE.WebGLRenderer({antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2)); document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.fog = new THREE.Fog(0x0d1117, 20, 60); S.background = new THREE.Color(0x0d1117);
const C = new THREE.PerspectiveCamera(60,1,.1,200); C.position.set(0,0,22);
function rs(){ R.setSize(innerWidth,innerHeight); C.aspect=innerWidth/innerHeight; C.updateProjectionMatrix(); } addEventListener('resize',rs); rs();
S.add(new THREE.AmbientLight(0x8899cc,.6)); const pl = new THREE.PointLight(0x58a6ff,3,80); pl.position.set(5,8,15); S.add(pl);
const stars = new THREE.BufferGeometry(); const sp = new Float32Array(1500*3); for (let i=0;i<sp.length;i++) sp[i]=(Math.random()-.5)*120; stars.setAttribute('position', new THREE.BufferAttribute(sp,3));
S.add(new THREE.Points(stars, new THREE.PointsMaterial({color:0x8b949e,size:.15})));
// sponsor monolith using ArcadeKit.billboard()
const tex = new THREE.CanvasTexture(ArcadeKit.billboard(512,256));
const mono = new THREE.Mesh(new THREE.BoxGeometry(10,5,.4), [0,0,0,0,new THREE.MeshBasicMaterial({map:tex}),new THREE.MeshBasicMaterial({map:tex})].map(m=>m||new THREE.MeshStandardMaterial({color:0x161b22})));
mono.position.set(0,0,-18); S.add(mono);
const orbs=[]; const gOrb = new THREE.SphereGeometry(1,24,16);
function spawn(){ const gold = Math.random()<.12; const m = new THREE.Mesh(gOrb, new THREE.MeshStandardMaterial({color:gold?0xd29922:[0x58a6ff,0xbc8cff,0x2ea043][orbs.length%3], emissive:gold?0x664400:0x0a1a33, metalness:.4, roughness:.3}));
  m.position.set((Math.random()-.5)*24,(Math.random()-.5)*12,(Math.random()-.5)*8); m.userData={gold, v:new THREE.Vector3((Math.random()-.5)*4,(Math.random()-.5)*4,0), s:.6+Math.random()*.6}; m.scale.setScalar(m.userData.s); S.add(m); orbs.push(m); }
const parts=[];
function burst(p,col){ for(let i=0;i<14;i++){ const q=new THREE.Mesh(new THREE.SphereGeometry(.12,6,4), new THREE.MeshBasicMaterial({color:col})); q.position.copy(p); q.userData.v=new THREE.Vector3((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.5)*14); q.userData.l=.6; S.add(q); parts.push(q);} }
let run=false, t=30, score=0; const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
addEventListener('pointerdown', e=>{ if(!run||e.target!==R.domElement) return; mv.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mv,C);
  const hit = ray.intersectObjects(orbs)[0]; if (hit){ const o=hit.object; score += o.userData.gold?50:10; burst(o.position,o.material.color); S.remove(o); orbs.splice(orbs.indexOf(o),1); spawn(); } else score=Math.max(0,score-3); });
document.getElementById('go').onclick=()=>{ orbs.forEach(o=>S.remove(o)); orbs.length=0; for(let i=0;i<14;i++) spawn(); run=true; t=30; score=0; document.getElementById('ov').style.display='none'; };
ArcadeKit.onChallenge(c => document.getElementById('msg').innerHTML = `<p class="pill blue">⚔️ beat ${c.name}'s ${c.score}</p>`);
const clk = new THREE.Clock();
(function loop(){ requestAnimationFrame(loop); const dt=Math.min(clk.getDelta(),.05);
  mono.rotation.y = Math.sin(performance.now()/2000)*.4;
  orbs.forEach(o=>{ o.position.addScaledVector(o.userData.v,dt); if(Math.abs(o.position.x)>13) o.userData.v.x*=-1; if(Math.abs(o.position.y)>7) o.userData.v.y*=-1; o.rotation.y+=dt; });
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.position.addScaledVector(q.userData.v,dt); q.userData.l-=dt; q.scale.setScalar(Math.max(.01,q.userData.l*1.6)); if(q.userData.l<=0){S.remove(q);parts.splice(i,1);} }
  if(run){ t-=dt; if(t<=0){ run=false; t=0; const rank=ArcadeKit.submitScore(score); document.getElementById('msg').innerHTML=`<p class="mono"><b style="font-size:26px">${score}</b> pts · rank #${rank} on this device</p>`; document.getElementById('go').textContent='▶ Again'; document.getElementById('ov').style.display='flex'; ArcadeKit.openBoard(); } }
  document.getElementById('sc').textContent=score; document.getElementById('tm').textContent=t.toFixed(1);
  R.render(S,C); })();
window.__orb = () => ({run, t, score, orbs:orbs.length});
</script></body></html>
