<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orb Pop 30 · Arcade Kit demo</title>
<meta name="description" content="Pop orbs for 30 seconds. Gold is worth more. Scores, dares, and a sponsor slot come from one script tag.">
<meta property="og:title" content="Orb Pop 30">
<meta property="og:description" content="A 30-second 3D pop game, and a demo of Arcade Kit: scores, challenge links, tips.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://raw.githack.com/alexnaughtonjr/games/main/arcade-kit/demo/">
<meta property="og:image" content="https://raw.githack.com/alexnaughtonjr/games/main/shared/og/kit.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Orb Pop 30">
<meta name="twitter:description" content="A 30-second 3D pop game, and a demo of Arcade Kit.">
<meta name="twitter:image" content="https://raw.githack.com/alexnaughtonjr/games/main/shared/og/kit.png">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="../../shared/theme.css">
<style>
html,body{height:100%;overflow:hidden;touch-action:manipulation}
canvas{display:block}
#hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:14px;font-family:var(--mono);pointer-events:none;text-shadow:0 0 8px #000}
#hud b{font-size:22px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,17,23,.62);padding:16px}
#ov .card{text-align:center;max-width:420px}
</style>
</head>
<body>
<div id="hud"><div><span class="muted small">SCORE</span><br><b id="sc">0</b></div><div><span class="muted small">COMBO</span><br><b id="cb">x1</b></div><div><span class="muted small">TIME</span><br><b id="tm">30</b></div></div>
<div id="ov"><div class="card">
  <span class="pill green">30 seconds · Arcade Kit</span>
  <h1 style="font-size:32px">ORB POP</h1>
  <p class="muted">Tap orbs. Chain them for a combo. Gold orbs are worth five times as much. Miss and the combo resets.</p>
  <div id="msg"></div>
  <div class="cta-row" style="justify-content:center">
    <button class="btn primary big" id="go" type="button">▶ Play</button>
    <a class="btn" href="../">Kit docs</a>
  </div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script src="../../shared/juice.js"></script>
<script src="../../shared/bloom.js"></script>
<script src="../kit.js" data-game="Orb Pop 30" data-venmo="alexnaughtonjr" data-contact="https://x.com/alexnaughtonjr" data-ad-price="50" data-position="bottom-left" data-ring="../../weekly-game-drop/neon-drift/,../../live-arcade/"></script>
<script>
const R = new THREE.WebGLRenderer({antialias:!LabFX.coarse, powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio, LabFX.coarse?1:1.5));
R.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x0d1117); S.fog = new THREE.FogExp2(0x0d1117, 0.02);
const C = new THREE.PerspectiveCamera(58,1,.1,200); C.position.set(0,0,20);
S.add(new THREE.AmbientLight(0x99aadd,.45));
const pl = new THREE.PointLight(0x58a6ff, 18, 80); pl.position.set(4,6,12); S.add(pl);
const pl2 = new THREE.PointLight(0xbc8cff, 8, 50); pl2.position.set(-6,-2,8); S.add(pl2);
let bloom;
function rs(){ R.setSize(innerWidth, innerHeight); C.aspect=innerWidth/innerHeight; C.updateProjectionMatrix(); if (bloom) bloom.resize(); }
addEventListener('resize', rs); rs();
const tex = LabFX.colorMap(new THREE.CanvasTexture(ArcadeKit.billboard(1024,512)));
const mono = new THREE.Mesh(new THREE.BoxGeometry(11,5.5,.4), [
  new THREE.MeshStandardMaterial({color:0x161b22}), new THREE.MeshStandardMaterial({color:0x161b22}),
  new THREE.MeshStandardMaterial({color:0x161b22}), new THREE.MeshStandardMaterial({color:0x161b22}),
  new THREE.MeshBasicMaterial({map:tex, toneMapped:false}), new THREE.MeshBasicMaterial({map:tex, toneMapped:false})
]);
mono.position.set(0,0,-16); S.add(mono);
const orbs=[], gOrb=new THREE.SphereGeometry(.9,20,14);
function spawn(){
  const gold=Math.random()<.14;
  const col=gold?0xffd33d:[0x58a6ff,0xbc8cff,0x3fb950][orbs.length%3];
  const m=new THREE.Mesh(gOrb, new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity: gold ? 0.8 : 0.35, metalness:.35, roughness:.25}));
  m.position.set((Math.random()-.5)*16,(Math.random()-.5)*9,(Math.random()-.5)*6);
  m.userData={gold, v:new THREE.Vector3((Math.random()-.5)*3.2,(Math.random()-.5)*3.2,0)};
  S.add(m); orbs.push(m);
}
const parts=[];
function burst(p,col){ for(let i=0;i<12;i++){ const q=new THREE.Mesh(new THREE.SphereGeometry(.1,5,4), new THREE.MeshBasicMaterial({color:col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false})); q.position.copy(p); q.userData.v=new THREE.Vector3((Math.random()-.5)*12,(Math.random()-.5)*12,(Math.random()-.5)*8); q.userData.l=.45; S.add(q); parts.push(q);} }
const shaker=LabFX.Shaker();
let run=false, t=30, score=0, combo=1, comboT=0;
const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
addEventListener('pointerdown', e=>{
  if(!run || e.target!==R.domElement) return;
  mv.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mv,C);
  const hit=ray.intersectObjects(orbs)[0];
  if(hit){
    const o=hit.object; combo=Math.min(12, combo+1); comboT=1.6;
    const pts=(o.userData.gold?50:10)*combo;
    score+=pts; burst(o.position, o.material.color); LabFX.sfx.orb(combo); if(combo%4===0) shaker.add(.25);
    S.remove(o); orbs.splice(orbs.indexOf(o),1); spawn();
  } else { combo=1; score=Math.max(0, score-5); LabFX.sfx.bad(); shaker.add(.15); }
});
document.getElementById('go').onclick=()=>{
  orbs.forEach(o=>S.remove(o)); orbs.length=0;
  for(let i=0;i<12;i++) spawn();
  run=true; t=30; score=0; combo=1; document.getElementById('ov').style.display='none'; LabFX.sfx.ui();
};
ArcadeKit.onChallenge(c => document.getElementById('msg').innerHTML = '<p class="pill blue">beat '+c.name+' · '+c.score+'</p>');
bloom = LabBloom(R,S,C,{strength:.7, threshold:.48, div:LabFX.coarse?4:2});
const clk=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.05);
  mono.rotation.y=Math.sin(performance.now()/1800)*.35;
  orbs.forEach(o=>{ o.position.addScaledVector(o.userData.v, dt); ['x','y'].forEach(k=>{ if(Math.abs(o.position[k])>(k==='x'?9:5.5)) o.userData.v[k]*=-1; }); o.rotation.y+=dt*2; });
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.position.addScaledVector(q.userData.v,dt); q.userData.l-=dt; q.material.opacity=Math.max(0,q.userData.l*2); if(q.userData.l<=0){ S.remove(q); parts.splice(i,1);} }
  if(run){
    if(comboT>0){ comboT-=dt; if(comboT<=0) combo=1; }
    t-=dt;
    if(t<=0){
      run=false; t=0; const rank=ArcadeKit.submitScore(score); LabFX.sfx.win();
      document.getElementById('msg').innerHTML='<p class="mono"><b style="font-size:28px">'+score+'</b> pts · #'+rank+' on this device</p>';
      document.getElementById('go').textContent='▶ Again';
      document.getElementById('ov').style.display='flex';
    }
  }
  document.getElementById('sc').textContent=score;
  document.getElementById('cb').textContent='x'+combo;
  document.getElementById('tm').textContent=Math.max(0,t).toFixed(1);
  const kick=shaker.apply(dt);
  C.position.x=kick.x*4; C.position.y=kick.y*3;
  bloom.render();
})();
</script>
</body>
</html>
